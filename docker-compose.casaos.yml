services:
  db_kyrustech:
    image: postgres:17-alpine
    container_name: db_kyrustech
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kyrus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kyrus_pass}
      - POSTGRES_DB=${POSTGRES_DB:-kyrus_erp}
      - POSTGRES_ALLOWED_CIDRS=${POSTGRES_ALLOWED_CIDRS:-}
    volumes:
      - db_kyrustech_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kyrus_portal
      - default

  app:
    image: ghcr.io/kcirus/kyrustech:kyruserp-1.0.0
    container_name: kyruserp_all
    restart: unless-stopped
    environment:
      - PROJECT_NAME=KyrusERP
      - ENVIRONMENT=production
      - SECRET_KEY=change-me-in-production-env
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ALGORITHM=HS256
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - AUTO_RUN_MIGRATIONS=0
      - POSTGRES_SERVER=db_kyrustech
      - POSTGRES_PORT=5432
      - POSTGRES_USER=kyrus_user
      - POSTGRES_PASSWORD=kyrus_pass
      - POSTGRES_DB=kyrus_erp
      - POSTGRES_ALLOWED_CIDRS=${POSTGRES_ALLOWED_CIDRS:-}
      - COPY_LEGACY_DATABASE=${COPY_LEGACY_DATABASE:-0}
      - DROP_UNUSED_TABLES=${DROP_UNUSED_TABLES:-0}
      - LEGACY_POSTGRES_SERVER=${LEGACY_POSTGRES_SERVER:-postgresql}
      - LEGACY_POSTGRES_PORT=${LEGACY_POSTGRES_PORT:-5432}
      - LEGACY_POSTGRES_USER=${LEGACY_POSTGRES_USER:-casaos}
      - LEGACY_POSTGRES_PASSWORD=${LEGACY_POSTGRES_PASSWORD:-casaos}
      - LEGACY_POSTGRES_DB=${LEGACY_POSTGRES_DB:-casaos}
      - AWS_ACCESS_KEY_ID=
      - AWS_SECRET_ACCESS_KEY=
      - AWS_S3_BUCKET_NAME=
      - AWS_S3_REGION=
      - AI_PROVIDER=gemini
      - AI_TIMEOUT_SECONDS=30
      - GEMINI_API_KEY=
      - GEMINI_MODEL=gemini-1.5-flash
      - OPENAI_API_KEY=
      - OPENAI_MODEL=gpt-4o-mini
    ports:
      - "8000:8000"
    depends_on:
      db_kyrustech:
        condition: service_healthy
    volumes:
      - ./static:/app/static
    networks:
      - kyrus_portal
      - default
    command: /bin/sh -c "python scripts/run_migrations.py ; uvicorn app.main:app --host 0.0.0.0 --port 8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: kyruserp_watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable

networks:
  kyrus_portal:
    external: true

volumes:
  db_kyrustech_data:

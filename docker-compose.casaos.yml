services:
  app:
    image: ghcr.io/kcirus/kyrustech:kyruserp-1.0.0
    container_name: kyruserp_all
    restart: unless-stopped
    environment:
      - PROJECT_NAME=KyrusERP
      - ENVIRONMENT=production
      - SECRET_KEY=change-me-in-production-env
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ALGORITHM=HS256
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - AUTO_RUN_MIGRATIONS=0
      - POSTGRES_SERVER=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_USER=kyrus_user
      - POSTGRES_PASSWORD=kyrus_pass
      - POSTGRES_DB=kyrus_db
      - AWS_ACCESS_KEY_ID=
      - AWS_SECRET_ACCESS_KEY=
      - AWS_S3_BUCKET_NAME=
      - AWS_S3_REGION=
      - AI_PROVIDER=gemini
      - AI_TIMEOUT_SECONDS=30
      - GEMINI_API_KEY=
      - GEMINI_MODEL=gemini-1.5-flash
      - OPENAI_API_KEY=
      - OPENAI_MODEL=gpt-4o-mini
    ports:
      - "8000:8000"
    volumes:
      - ./static:/app/static
    networks:
      - kyrus_portal
      - default
    command: /bin/sh -c "python scripts/run_migrations.py ; uvicorn app.main:app --host 0.0.0.0 --port 8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: kyruserp_watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable

volumes: {}

networks:
  kyrus_portal:
    external: true

services:
  db_kyrustech:
    image: postgres:17-alpine
    container_name: db_kyrustech
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kyrus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kyrus_pass}
      - POSTGRES_DB=${POSTGRES_DB:-kyrus_erp}
      - POSTGRES_ALLOWED_CIDRS=${POSTGRES_ALLOWED_CIDRS:-}
    volumes:
      - db_kyrustech_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kyrus_portal
      - kyrustech_network

  backend:
    build: .
    container_name: kyrustech_backend_prod
    restart: always
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-KyrusTech}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - ALGORITHM=${ALGORITHM:-HS256}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-https://api.seu-dominio.com}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-https://seu-dominio.com,https://www.seu-dominio.com}
      - AUTO_RUN_MIGRATIONS=${AUTO_RUN_MIGRATIONS:-0}
      - POSTGRES_SERVER=db_kyrustech
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kyrus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kyrus_pass}
      - POSTGRES_DB=${POSTGRES_DB:-kyrus_erp}
      - POSTGRES_ALLOWED_CIDRS=${POSTGRES_ALLOWED_CIDRS:-}
      - COPY_LEGACY_DATABASE=${COPY_LEGACY_DATABASE:-0}
      - DROP_UNUSED_TABLES=${DROP_UNUSED_TABLES:-0}
      - LEGACY_POSTGRES_SERVER=${LEGACY_POSTGRES_SERVER:-postgresql}
      - LEGACY_POSTGRES_PORT=${LEGACY_POSTGRES_PORT:-5432}
      - LEGACY_POSTGRES_USER=${LEGACY_POSTGRES_USER:-casaos}
      - LEGACY_POSTGRES_PASSWORD=${LEGACY_POSTGRES_PASSWORD:-casaos}
      - LEGACY_POSTGRES_DB=${LEGACY_POSTGRES_DB:-casaos}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-}
      - AWS_S3_REGION=${AWS_S3_REGION:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db_kyrustech:
        condition: service_healthy
    volumes:
      - ./static:/app/static
    networks:
      - kyrus_portal
      - kyrustech_network
    profiles:
      - prod
    command: /bin/sh -c "python scripts/run_migrations.py ; uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  nginx:
    image: nginx:alpine
    container_name: kyrustech_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static:ro
      - ./kyrus-web/dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - kyrustech_network
    profiles:
      - prod

networks:
  kyrus_portal:
    external: true
  kyrustech_network:
    driver: bridge

volumes:
  db_kyrustech_data:

version: '3.8'

services:
  backend:
    build: .
    container_name: kyrustech_backend_ssl
    restart: always
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-KyrusTech}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - ALGORITHM=${ALGORITHM:-HS256}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-kyrus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kyrus_pass}
      - POSTGRES_DB=${POSTGRES_DB:-kyrus_db}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-}
      - AWS_S3_REGION=${AWS_S3_REGION:-}
    volumes:
      - ./static:/app/static
    networks:
      - kyrustech_network
    expose:
      - "8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  nginx:
    image: nginx:alpine
    container_name: kyrustech_nginx_ssl
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static:ro
      - ./kyrus-web/dist:/usr/share/nginx/html:ro
      - ./certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - kyrustech_network

  # Certbot para SSL automático (opcional, descomente se quiser usar)
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: kyrustech_certbot
  #   volumes:
  #     - ./certs:/etc/letsencrypt
  #     - certbot_www:/var/www/certbot
  #   command: certonly --webroot -w /var/www/certbot --email seu-email@exemplo.com -d seu-dominio.com --agree-tos --non-interactive

networks:
  kyrustech_network:
    driver: bridge

volumes:
  certbot_www:

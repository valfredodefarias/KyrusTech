services:
  db_kyrustech:
    image: postgres:17-alpine
    container_name: db_kyrustech
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kyrus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kyrus_pass}
      - POSTGRES_DB=${POSTGRES_DB:-kyrus_erp}
      - POSTGRES_ALLOWED_CIDRS=${POSTGRES_ALLOWED_CIDRS:-}
    ports:
      - "5432:5432"
    volumes:
      - db_kyrustech_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=64MB", "-c", "maintenance_work_mem=128MB", "-c", "effective_cache_size=1.5GB", "-c", "synchronous_commit=off", "-c", "checkpoint_completion_target=0.9", "-c", "random_page_cost=1.1", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kyrus_db_internal

  backend:
    build: .
    container_name: kyrustech_backend
    restart: always
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-KyrusTech}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      - ALGORITHM=${ALGORITHM:-HS256}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - AUTO_RUN_MIGRATIONS=${AUTO_RUN_MIGRATIONS:-0}
      - POSTGRES_SERVER=db_kyrustech
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kyrus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kyrus_pass}
      - POSTGRES_DB=${POSTGRES_DB:-kyrus_erp}
      - POSTGRES_ALLOWED_CIDRS=${POSTGRES_ALLOWED_CIDRS:-}
      - COPY_LEGACY_DATABASE=${COPY_LEGACY_DATABASE:-0}
      - DROP_UNUSED_TABLES=${DROP_UNUSED_TABLES:-0}
      - LEGACY_POSTGRES_SERVER=${LEGACY_POSTGRES_SERVER:-postgresql}
      - LEGACY_POSTGRES_PORT=${LEGACY_POSTGRES_PORT:-5432}
      - LEGACY_POSTGRES_USER=${LEGACY_POSTGRES_USER:-casaos}
      - LEGACY_POSTGRES_PASSWORD=${LEGACY_POSTGRES_PASSWORD:-casaos}
      - LEGACY_POSTGRES_DB=${LEGACY_POSTGRES_DB:-casaos}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-}
      - AWS_S3_REGION=${AWS_S3_REGION:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DISABLE_SCHEDULER=${DISABLE_SCHEDULER:-0}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./static:/app/static
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
    networks:
      - kyrus_portal
      - kyrus_db_internal
    depends_on:
      db_kyrustech:
        condition: service_healthy
    command: /bin/sh -c "python scripts/run_migrations.py ; uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  frontend:
    build:
      context: ./kyrus-web
      dockerfile: Dockerfile
      args:
        # Isso "imprime" o IP dentro do código HTML/JS na hora de construir
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: kyrustech_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    # IMPORTANTE: Não coloque "command" aqui. Deixe o Dockerfile usar o padrão "serve".

networks:
  kyrus_portal:
    external: true
  kyrus_db_internal:
    internal: true

volumes:
  db_kyrustech_data:

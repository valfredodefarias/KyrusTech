services:
  backend:
    build: .
    container_name: kyrustech_backend
    restart: always
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-KyrusTech}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - ALGORITHM=${ALGORITHM:-HS256}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-*}
      - POSTGRES_SERVER=${POSTGRES_SERVER:-postgresql}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-kyrus_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kyrus_pass}
      - POSTGRES_DB=${POSTGRES_DB:-kyrus_db}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-}
      - AWS_S3_REGION=${AWS_S3_REGION:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./static:/app/static
    networks:
      - kyrus_portal
      - default
    command: /bin/sh -c "python scripts/run_migrations.py ; uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./kyrus-web
      dockerfile: Dockerfile
      args:
        # Isso "imprime" o IP dentro do código HTML/JS na hora de construir
        VITE_API_URL: https://api.kyrustech.com.br/api/v1
    container_name: kyrustech_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    # IMPORTANTE: Não coloque "command" aqui. Deixe o Dockerfile usar o padrão "serve".

volumes: {}

networks:
  kyrus_portal:
    external: true

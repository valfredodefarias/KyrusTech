<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cartões - Kyrus ERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Bibliotecas e Temas -->
    <script type="module" src="js/init-theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { primary: 'var(--color-primary)' },
                    screens: { 'xs': '475px' } 
                } 
            } 
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* Drawer e UI */
        .drawer-base { 
            position: fixed; top: 0; bottom: 0; right: 0; z-index: 50;
            background: white; border-left: 1px solid #e2e8f0;
            transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .dark .drawer-base { background: #1e293b; border-color: #334155; }
        .drawer-open { transform: translateX(0); }
        .overlay { 
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(2px); z-index: 40; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s; 
        }
        .overlay-open { opacity: 1; pointer-events: auto; }
        .card-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .input-senior { 
            width: 100%; padding: 10px 12px; border-radius: 0.5rem;
            border: 1px solid #e2e8f0; background-color: #fff; color: #1e293b;
            font-size: 0.875rem; outline: none; transition: border-color 0.2s;
        }
        .dark .input-senior { background-color: #0f172a; border-color: #334155; color: #f1f5f9; }
        .input-senior:focus { border-color: var(--color-primary); }
        .label-senior { 
            display: block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; 
            color: #64748b; margin-bottom: 4px; letter-spacing: 0.05em;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans h-screen flex overflow-hidden">

    <!-- Sidebar Injetada -->
    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-full relative overflow-y-auto custom-scrollbar">
        
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex justify-between items-center shadow-sm z-20 sticky top-0">
            <div>
                <h2 class="text-xl font-bold tracking-tight">Cartões de Crédito</h2>
                <p class="text-sm text-slate-400">Gestão de limites e faturas</p>
            </div>
            <div class="flex gap-2">
                <div class="relative min-w-[200px] hidden sm:block">
                    <select id="filtroGlobalCC" onchange="aplicarFiltroGlobal()" class="input-senior w-full pl-9 cursor-pointer shadow-sm">
                        <option value="">Todas as Filiais</option>
                    </select>
                    <i data-lucide="building-2" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                </div>
                <button onclick="carregarDados()" class="p-2 text-slate-400 hover:text-blue-500 transition border border-slate-200 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-700">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
                <button onclick="abrirDrawer()" class="bg-primary hover:brightness-90 text-white px-5 py-2 rounded-lg shadow-md flex items-center gap-2 font-bold transition active:scale-95 text-sm whitespace-nowrap">
                    <i data-lucide="plus" class="w-4 h-4"></i> Novo Cartão
                </button>
            </div>
        </header>

        <div class="p-6 space-y-8 max-w-7xl mx-auto w-full">
            <div id="listaCartoes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-10 text-slate-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i> Carregando...
                </div>
            </div>

            <div id="areaFatura" class="hidden bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden animate-fade-in-up">
                <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center gap-4">
                        <button onclick="mudarMesFatura(-1)" class="p-2 hover:bg-white dark:hover:bg-slate-700 rounded-full transition text-slate-500"><i data-lucide="chevron-left"></i></button>
                        <div class="text-center min-w-[150px]">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Fatura de</p>
                            <h3 class="text-xl font-extrabold text-slate-800 dark:text-white capitalize" id="lblMesFatura">...</h3>
                        </div>
                        <button onclick="mudarMesFatura(1)" class="p-2 hover:bg-white dark:hover:bg-slate-700 rounded-full transition text-slate-500"><i data-lucide="chevron-right"></i></button>
                    </div>
                    <div class="flex items-center gap-6">
                        <div class="text-right">
                            <p class="text-xs font-bold text-slate-400 uppercase">Total da Fatura</p>
                            <p class="text-2xl font-extrabold text-slate-800 dark:text-white" id="lblTotalFatura">R$ 0,00</p>
                            <p class="text-xs text-slate-500 mt-1" id="lblVencimento">-</p>
                        </div>
                        <button id="btnPagarFatura" onclick="pagarFaturaInteira()" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white pl-4 pr-5 py-2 rounded-lg shadow-lg flex items-center gap-3 transition transform active:scale-95">
                            <div class="bg-white/20 p-1 rounded"><i data-lucide="check-circle-2" class="w-5 h-5 text-white"></i></div>
                            <div class="text-left">
                                <p class="text-[10px] font-bold uppercase opacity-90 leading-none mb-0.5">Pagar Fatura</p>
                                <p class="text-sm font-bold" id="lblValorPagar">R$ 0,00</p>
                            </div>
                        </button>
                    </div>
                </div>
                <div class="max-h-[500px] overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 dark:bg-slate-700 text-xs font-bold text-slate-500 uppercase sticky top-0 z-10">
                            <tr>
                                <th class="px-6 py-3">Data</th>
                                <th class="px-6 py-3">Descrição</th>
                                <th class="px-6 py-3">Parcela</th>
                                <th class="px-6 py-3 text-right">Valor</th>
                                <th class="px-6 py-3 text-center">Status</th>
                            </tr>
                        </thead>
                        <tbody id="listaFatura" class="divide-y divide-slate-100 dark:divide-slate-700 text-sm dark:text-slate-300"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- DRAWER & MODALS -->
    <div id="drawerOverlay" onclick="fecharModal()" class="overlay fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40"></div>

    <div id="modalCartao" class="drawer-base fixed inset-y-0 right-0 w-full sm:w-[500px] z-50">
        <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">
            <h3 class="font-bold text-lg text-slate-800 dark:text-white" id="modalTitulo">Gerenciar Cartão</h3>
            <button onclick="fecharModal()" class="p-2 bg-slate-200 dark:bg-slate-700 rounded-full hover:opacity-80 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-5 custom-scrollbar">
            <!-- Preview do Cartão -->
            <div class="relative group perspective select-none">
                <div class="card-gradient rounded-xl p-6 text-white shadow-lg h-44 flex flex-col justify-between relative overflow-hidden">
                    <div class="absolute top-0 right-0 -mr-10 -mt-10 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"></div>
                    <div class="flex justify-between items-start z-10">
                        <div class="opacity-90 font-mono text-sm tracking-widest font-bold">KYRUS CARD</div>
                        <span id="previewCentro" class="text-[10px] bg-white/20 px-2 py-0.5 rounded uppercase font-bold backdrop-blur-sm">MATRIZ</span>
                    </div>
                    <div class="z-10 mt-2">
                         <div class="text-[10px] uppercase opacity-70 mb-1">Nome do Cartão</div>
                         <div class="font-bold text-xl tracking-wide truncate" id="previewNome">SEU CARTÃO</div>
                    </div>
                    <div class="flex justify-between items-end z-10">
                        <div><div class="text-[9px] uppercase opacity-70">Limite Total</div><div class="font-bold font-mono" id="previewLimite">R$ 0,00</div></div>
                        <div class="text-right"><div class="text-[9px] uppercase opacity-70">Vencimento</div><div class="font-bold text-sm font-mono" id="previewVence">DIA 10</div></div>
                    </div>
                </div>
            </div>

            <!-- Formulário -->
            <div id="formCartao" class="space-y-4">
                <input type="hidden" id="cartaoId">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="label-senior">Centro de Custo</label>
                        <select id="centro_custo_id" class="input-senior w-full pl-2 cursor-pointer" onchange="atualizarPreview()">
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <div>
                        <label class="label-senior">Conta Padrão</label>
                        <select id="conta_id" class="input-senior w-full pl-2 cursor-pointer">
                            <option value="">Perguntar ao pagar</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="label-senior">Nome do Cartão</label>
                        <input type="text" id="nome_cartao" class="input-senior" placeholder="Ex: Nubank Black" required oninput="atualizarPreview()">
                    </div>
                    <div class="col-span-2">
                        <label class="label-senior">Limite Total</label>
                        <input type="number" step="0.01" id="limite_total" class="input-senior" placeholder="0,00" required oninput="atualizarPreview()">
                    </div>
                    <div>
                        <label class="label-senior text-purple-600">Dia Fechamento</label>
                        <input type="number" id="dia_fechamento" class="input-senior text-center font-bold" placeholder="01" min="1" max="31" required oninput="atualizarPreview()">
                    </div>
                    <div>
                        <label class="label-senior text-red-500">Dia Vencimento</label>
                        <input type="number" id="dia_vencimento" class="input-senior text-center font-bold" placeholder="10" min="1" max="31" required oninput="atualizarPreview()">
                    </div>
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex justify-end gap-3">
            <button onclick="fecharModal()" class="px-5 py-3 rounded-xl text-slate-500 font-bold hover:bg-slate-200 dark:hover:bg-slate-700 text-sm transition">Cancelar</button>
            <button onclick="salvarCartao()" class="px-8 py-3 rounded-xl bg-primary text-white font-bold shadow-lg text-sm flex items-center gap-2 active:scale-95 transition"><i data-lucide="check" class="w-4 h-4"></i> Salvar</button>
        </div>
    </div>

    <!-- SCRIPT CORRIGIDO -->
    <script type="module">
        import { authGuard } from './js/auth.js';
        import { renderSidebar } from './js/components.js';
        import { apiFetch } from './js/api.js';
        import { initTheme } from './js/theme.js';

        // 1. VINCULAR AO ESCOPO GLOBAL PRIMEIRO (Evita o erro "is not defined")
        window.abrirDrawer = abrirDrawer;
        window.fecharModal = fecharModal;
        window.salvarCartao = salvarCartao;
        window.editarCartao = editarCartao;
        window.selecionarCartao = selecionarCartao;
        window.mudarMesFatura = mudarMesFatura;
        window.pagarFaturaInteira = pagarFaturaInteira;
        window.atualizarPreview = atualizarPreview;
        window.aplicarFiltroGlobal = aplicarFiltroGlobal;
        window.carregarDados = carregarDados;

        // 2. INICIALIZAÇÃO SEGURA
        try {
            authGuard();
            initTheme();
            renderSidebar('cartoes');
        } catch(e) {
            console.error("Erro na inicialização:", e);
        }

        // 3. VARIÁVEIS E LÓGICA
        const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
        let cartoesList = [], centrosList = [], todosLancamentos = [], contasList = [];
        let cartaoSelecionadoId = null;
        let mesFaturaAtual = new Date();
        let itensFaturaAtuais = [];

        carregarDados();

        async function carregarDados() {
            try {
                const [cRes, lRes, ccRes, contaRes] = await Promise.all([
                    apiFetch('/cartoes/'),
                    apiFetch('/lancamentos/'),
                    apiFetch('/centro_custo/'),
                    apiFetch('/contas/')
                ]);
                cartoesList = cRes || [];
                todosLancamentos = lRes || [];
                centrosList = ccRes || [];
                contasList = contaRes || [];
                
                popularSelects();
                aplicarFiltroGlobal();
                if(cartaoSelecionadoId) atualizarFatura();
                lucide.createIcons();
            } catch (e) { console.error(e); }
        }

        function popularSelects() {
            const modalSelect = document.getElementById('centro_custo_id');
            const filterSelect = document.getElementById('filtroGlobalCC');
            const contaSelect = document.getElementById('conta_id');
            
            modalSelect.innerHTML = '<option value="">Selecione...</option>';
            filterSelect.innerHTML = '<option value="">Todas as Filiais</option>';
            contaSelect.innerHTML = '<option value="">Perguntar ao pagar</option>';

            centrosList.filter(cc => cc.status === 'ATIVO').forEach(cc => {
                const opt = `<option value="${cc.id}">${cc.nome}</option>`;
                modalSelect.innerHTML += opt;
                filterSelect.innerHTML += opt;
            });

            contasList.forEach(c => {
                contaSelect.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
            });
        }

        function aplicarFiltroGlobal() {
            const filtroId = document.getElementById('filtroGlobalCC').value;
            const grid = document.getElementById('listaCartoes');
            const cartoesFiltrados = filtroId ? cartoesList.filter(c => String(c.centro_custo_id) === String(filtroId)) : cartoesList;

            if (cartoesFiltrados.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-slate-400 py-10 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl">Nenhum cartão encontrado.</div>';
                return;
            }

            grid.innerHTML = cartoesFiltrados.map(c => {
                const nomeCC = centrosList.find(cc => cc.id === c.centro_custo_id)?.nome || 'S/ Vínculo';
                const gastos = todosLancamentos.filter(l => l.cartao_id === c.id && l.status !== 'PAGO').reduce((acc, l) => acc + parseFloat(l.valor_previsto), 0);
                const limiteTotal = parseFloat(c.limite_total);
                const limiteDisponivel = limiteTotal - gastos;
                let percentualUso = limiteTotal > 0 ? (gastos / limiteTotal) * 100 : 0;
                const isSelected = c.id === cartaoSelecionadoId;
                const borderClass = isSelected ? 'ring-2 ring-primary border-transparent' : 'border-slate-200 dark:border-slate-700';
                
                return `
                    <div onclick="selecionarCartao(${c.id})" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border ${borderClass} hover:border-primary transition cursor-pointer group overflow-hidden">
                        <div class="card-gradient p-5 rounded-lg text-white relative shadow-lg m-2 mb-0">
                             <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl pointer-events-none"></div>
                             <div class="flex justify-between items-start mb-4 relative z-10">
                                <div><span class="font-bold text-lg block leading-tight">${c.nome_cartao}</span><span class="text-[9px] bg-white/20 px-1.5 py-0.5 rounded font-bold uppercase backdrop-blur-sm tracking-wide">${nomeCC}</span></div>
                                <button onclick="editarCartao(${c.id}, event)" class="p-1.5 bg-white/10 hover:bg-white/30 rounded-lg backdrop-blur-sm transition"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                             </div>
                             <div class="relative z-10">
                                <div class="flex justify-between items-end mb-1">
                                    <div><p class="text-[10px] opacity-70 uppercase font-bold">Disponível</p><p class="font-bold text-xl leading-none">${BRL.format(limiteDisponivel)}</p></div>
                                    <div class="text-right"><p class="text-[9px] opacity-70 uppercase font-bold">Total</p><p class="font-bold text-xs">${BRL.format(limiteTotal)}</p></div>
                                </div>
                                <div class="w-full bg-black/20 h-1.5 rounded-full overflow-hidden"><div class="bg-white h-full rounded-full transition-all duration-700 ease-out" style="width: ${Math.min(percentualUso, 100)}%"></div></div>
                            </div>
                        </div>
                        <div class="p-3 text-center"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center justify-center gap-1">${isSelected ? 'Fatura Aberta' : 'Ver Fatura'} <i data-lucide="chevron-down" class="w-3 h-3"></i></span></div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function selecionarCartao(id) {
            cartaoSelecionadoId = id;
            aplicarFiltroGlobal();
            document.getElementById('areaFatura').classList.remove('hidden');
            atualizarFatura();
            if(window.innerWidth < 1024) document.getElementById('areaFatura').scrollIntoView({behavior:'smooth'});
        }

        function mudarMesFatura(delta) {
            mesFaturaAtual.setMonth(mesFaturaAtual.getMonth() + delta);
            atualizarFatura();
        }

        function atualizarFatura() {
            const cartao = cartoesList.find(c => c.id === cartaoSelecionadoId);
            if (!cartao) return;

            const ano = mesFaturaAtual.getFullYear();
            const mes = mesFaturaAtual.getMonth();
            const diaVenc = cartao.dia_vencimento || 10;
            const dataVencimento = new Date(ano, mes, diaVenc);
            
            document.getElementById('lblMesFatura').innerText = dataVencimento.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            document.getElementById('lblVencimento').innerText = "Vence em " + dataVencimento.toLocaleDateString('pt-BR');
            
            const strMesAno = dataVencimento.toISOString().slice(0, 7); 
            itensFaturaAtuais = todosLancamentos.filter(l => l.cartao_id === cartao.id && l.data_vencimento.startsWith(strMesAno));
            
            const total = itensFaturaAtuais.reduce((acc, l) => acc + parseFloat(l.valor_previsto), 0);
            document.getElementById('lblTotalFatura').innerText = BRL.format(total);

            const itensPendentes = itensFaturaAtuais.filter(l => l.status !== 'PAGO');
            const totalPendente = itensPendentes.reduce((acc, l) => acc + parseFloat(l.valor_previsto), 0);
            const btnPagar = document.getElementById('btnPagarFatura');

            if (itensPendentes.length > 0 && totalPendente > 0) {
                btnPagar.classList.remove('hidden');
                document.getElementById('lblValorPagar').innerText = BRL.format(totalPendente);
            } else { btnPagar.classList.add('hidden'); }

            const tbody = document.getElementById('listaFatura');
            if (itensFaturaAtuais.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400">Nenhuma despesa nesta fatura.</td></tr>'; return; }

            tbody.innerHTML = itensFaturaAtuais.map(l => `
                <tr class="border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800/50">
                    <td class="px-6 py-3 text-slate-500 text-xs font-mono">${new Date(l.data_competencia).toLocaleDateString('pt-BR')}</td>
                    <td class="px-6 py-3 font-medium flex items-center gap-2">${l.descricao} ${l.status === 'PAGO' ? '<i data-lucide="check" class="w-3 h-3 text-emerald-500"></i>' : ''}</td>
                    <td class="px-6 py-3 text-xs text-slate-400">${l.numero_parcela ? `${l.numero_parcela}x` : 'À vista'}</td>
                    <td class="px-6 py-3 text-right font-bold text-slate-700 dark:text-slate-200">${BRL.format(l.valor_previsto)}</td>
                    <td class="px-6 py-3 text-center"><span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${l.status === 'PAGO' ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-500'}">${l.status}</span></td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        async function pagarFaturaInteira() {
            const itensParaPagar = itensFaturaAtuais.filter(l => l.status !== 'PAGO');
            if (itensParaPagar.length === 0) return;

            const total = itensParaPagar.reduce((acc, l) => acc + parseFloat(l.valor_previsto), 0);
            const ids = itensParaPagar.map(l => l.id);
            const dataHoje = new Date().toISOString().split('T')[0];
            const cartao = cartoesList.find(c => c.id === cartaoSelecionadoId);
            let contaId = cartao.conta_id;
            let dataPagamento = dataHoje;

            if (!contaId) {
                const opcoesContas = contasList.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
                const { value: formValues } = await Swal.fire({
                    title: 'Pagar Fatura',
                    html: `<div class="text-left mb-4 bg-slate-50 p-3 rounded border"><p class="text-xs text-slate-500 uppercase font-bold">Total a Pagar</p><p class="text-xl font-bold text-emerald-600">${BRL.format(total)}</p></div><label class="block text-left text-xs font-bold text-slate-500 uppercase mb-1">Data</label><input type="date" id="swal-date" class="w-full p-2 border rounded mb-3" value="${dataHoje}"><label class="block text-left text-xs font-bold text-slate-500 uppercase mb-1">Sair da Conta</label><select id="swal-account" class="w-full p-2 border rounded"><option value="" disabled selected>Selecione...</option>${opcoesContas}</select>`,
                    showCancelButton: true, confirmButtonText: 'Confirmar', confirmButtonColor: '#10b981',
                    preConfirm: () => { return { data: document.getElementById('swal-date').value, conta: document.getElementById('swal-account').value }; }
                });
                if (!formValues || !formValues.conta) return;
                contaId = parseInt(formValues.conta);
                dataPagamento = formValues.data;
            } else {
                const nomeConta = contasList.find(c => c.id === contaId)?.nome || 'Conta Padrão';
                const { value: dataConfirmada } = await Swal.fire({ title: 'Confirmar Pagamento', text: `Debitar R$ ${BRL.format(total)} da conta "${nomeConta}"?`, icon: 'question', input: 'date', inputValue: dataHoje, showCancelButton: true, confirmButtonText: 'Sim, Pagar', confirmButtonColor: '#10b981' });
                if(!dataConfirmada) return;
                dataPagamento = dataConfirmada;
            }

            const res = await apiFetch('/lancamentos/bulk-pay', {
                method: 'POST',
                body: JSON.stringify({ ids: ids, data_pagamento: dataPagamento, conta_id: contaId, copiar_valor: true })
            });

            if (res) { Swal.fire('Sucesso!', 'Fatura paga.', 'success'); carregarDados(); }
        }

        // --- FUNÇÕES CRUD ---
        function atualizarPreview() {
            const nome = document.getElementById('nome_cartao').value;
            const limite = document.getElementById('limite_total').value;
            const vence = document.getElementById('dia_vencimento').value;
            const ccId = document.getElementById('centro_custo_id').value;
            document.getElementById('previewNome').innerText = nome || 'SEU CARTÃO';
            document.getElementById('previewLimite').innerText = limite ? BRL.format(parseFloat(limite)) : 'R$ 0,00';
            document.getElementById('previewVence').innerText = vence ? `DIA ${vence}` : '--';
            const cc = centrosList.find(c => String(c.id) === String(ccId));
            document.getElementById('previewCentro').innerText = cc ? cc.nome : 'S/ VÍNCULO';
        }

        function abrirDrawer() {
            document.getElementById('cartaoId').value = ''; document.getElementById('nome_cartao').value = ''; document.getElementById('limite_total').value = ''; document.getElementById('dia_fechamento').value = ''; document.getElementById('dia_vencimento').value = ''; document.getElementById('centro_custo_id').value = ''; document.getElementById('conta_id').value = ''; 
            document.getElementById('modalTitulo').innerText = 'Novo Cartão'; document.getElementById('previewCentro').innerText = 'S/ VÍNCULO'; atualizarPreview();
            document.getElementById('drawerOverlay').classList.add('overlay-open'); document.getElementById('modalCartao').classList.add('drawer-open');
        }

        function editarCartao(id, e) {
            e.stopPropagation();
            const c = cartoesList.find(x => x.id === id);
            document.getElementById('cartaoId').value = c.id; document.getElementById('nome_cartao').value = c.nome_cartao; document.getElementById('limite_total').value = c.limite_total; document.getElementById('dia_fechamento').value = c.dia_fechamento; document.getElementById('dia_vencimento').value = c.dia_vencimento; document.getElementById('centro_custo_id').value = c.centro_custo_id || ""; document.getElementById('conta_id').value = c.conta_id || ""; 
            document.getElementById('modalTitulo').innerText = 'Editar Cartão'; atualizarPreview();
            document.getElementById('drawerOverlay').classList.add('overlay-open'); document.getElementById('modalCartao').classList.add('drawer-open');
        }

        async function salvarCartao() {
            const id = document.getElementById('cartaoId').value;
            const payload = {
                nome_cartao: document.getElementById('nome_cartao').value,
                limite_total: parseFloat(document.getElementById('limite_total').value),
                dia_fechamento: parseInt(document.getElementById('dia_fechamento').value),
                dia_vencimento: parseInt(document.getElementById('dia_vencimento').value),
                centro_custo_id: parseInt(document.getElementById('centro_custo_id').value) || null,
                conta_id: parseInt(document.getElementById('conta_id').value) || null,
                status: "ATIVO"
            };
            
            let res;
            if (id) res = await apiFetch(`/cartoes/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
            else res = await apiFetch('/cartoes/', { method: 'POST', body: JSON.stringify(payload) });
            
            if (res) { fecharModal(); carregarDados(); Swal.fire({ icon: 'success', title: 'Salvo!', timer: 1500, showConfirmButton: false }); }
        }

        function fecharModal() {
            document.getElementById('drawerOverlay').classList.remove('overlay-open');
            document.getElementById('modalCartao').classList.remove('drawer-open');
        }
    </script>
</body>
</html>

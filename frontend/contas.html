<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contas - Kyrus ERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Scripts e Temas -->
    <script type="module" src="js/init-theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { primary: 'var(--color-primary)' },
                    screens: { 'xs': '475px' } 
                } 
            } 
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .drawer-base { 
            position: fixed; top: 0; bottom: 0; right: 0; z-index: 50;
            background: white; border-left: 1px solid #e2e8f0;
            transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .dark .drawer-base { background: #1e293b; border-color: #334155; }
        .drawer-open { transform: translateX(0); }
        .overlay { 
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); 
            backdrop-filter: blur(2px); z-index: 40; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s; 
        }
        .overlay-open { opacity: 1; pointer-events: auto; }
        
        .conta-card { transition: all 0.2s; border: 1px solid transparent; }
        .conta-card:hover { transform: translateY(-2px); border-color: var(--color-primary); }
        
        .input-senior { 
            width: 100%; padding: 10px 12px; border-radius: 0.5rem;
            border: 1px solid #e2e8f0; background-color: #fff; color: #1e293b;
            font-size: 0.875rem; outline: none; transition: border-color 0.2s;
        }
        .dark .input-senior { background-color: #0f172a; border-color: #334155; color: #f1f5f9; }
        .input-senior:focus { border-color: var(--color-primary); }
        
        .label-senior { 
            display: block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; 
            color: #64748b; margin-bottom: 4px; letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-full relative overflow-y-auto custom-scrollbar">
        
        <!-- HEADER -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex justify-between items-center shadow-sm z-20 sticky top-0">
            <div>
                <h2 class="text-xl font-bold tracking-tight">Contas Bancárias</h2>
                <p class="text-sm text-slate-400">Caixas, Bancos e Investimentos</p>
            </div>
            <div class="flex gap-2">
                <button onclick="carregarDados()" class="p-2 text-slate-400 hover:text-blue-500 transition border border-slate-200 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-700" title="Atualizar">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
                <button onclick="abrirDrawer()" class="bg-primary hover:brightness-90 text-white px-5 py-2 rounded-lg shadow-md flex items-center gap-2 font-bold transition active:scale-95 text-sm whitespace-nowrap">
                    <i data-lucide="plus" class="w-4 h-4"></i> Nova Conta
                </button>
            </div>
        </header>

        <!-- GRID DE CONTAS -->
        <div class="p-6 space-y-6 pb-32">
            
            <!-- Resumo -->
            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Saldo Geral Disponível</p>
                    <p class="text-2xl font-black text-slate-800 dark:text-white mt-1" id="saldoGeral">R$ 0,00</p>
                </div>
                <div class="p-3 bg-blue-50 dark:bg-blue-900/20 text-blue-600 rounded-full">
                    <i data-lucide="landmark" class="w-6 h-6"></i>
                </div>
            </div>

            <div id="gridContas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-10 text-slate-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                    Carregando contas...
                </div>
            </div>
        </div>
    </main>

    <!-- OVERLAY -->
    <div id="drawerOverlay" onclick="fecharTodosDrawers()" class="overlay fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40"></div>

    <!-- DRAWER: NOVA/EDITAR CONTA -->
    <div id="drawerLateral" class="drawer-base fixed inset-y-0 right-0 w-full sm:w-[500px] z-50">
        <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">
            <h2 class="text-lg font-bold text-slate-800 dark:text-white" id="drawerTitulo">Nova Conta</h2>
            <button onclick="fecharTodosDrawers()" class="p-2 bg-slate-200 dark:bg-slate-700 rounded-full hover:opacity-80 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-5">
            <input type="hidden" id="contaId">
            
            <div>
                <label class="label-senior">Nome da Conta / Apelido</label>
                <input type="text" id="nome" class="input-senior" placeholder="Ex: Itaú Principal" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="label-senior">Tipo</label>
                    <select id="tipo" class="input-senior cursor-pointer">
                        <option value="CORRENTE">Conta Corrente</option>
                        <option value="POUPANCA">Poupança</option>
                        <option value="CAIXA">Caixa Físico</option>
                        <option value="INVESTIMENTO">Investimento</option>
                    </select>
                </div>
                <div>
                    <label class="label-senior">Banco (Instituição)</label>
                    <input type="text" id="banco" class="input-senior" placeholder="Ex: Nubank">
                </div>
            </div>

            <div>
                <label class="label-senior">Saldo Inicial (Abertura)</label>
                <input type="number" step="0.01" id="saldo_inicial" class="input-senior font-bold text-lg" placeholder="0.00">
                <p class="text-[10px] text-slate-400 mt-1">Quanto tinha na conta ao começar a usar o sistema.</p>
            </div>

            <div>
                <label class="label-senior">Vincular a Centro de Custo (Filial)</label>
                <select id="centro_custo_id" class="input-senior cursor-pointer"></select>
            </div>

            <div>
                <label class="label-senior">Status</label>
                <select id="status" class="input-senior cursor-pointer">
                    <option value="ATIVO">Ativa</option>
                    <option value="INATIVO">Inativa / Arquivada</option>
                </select>
            </div>
        </div>

        <div class="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex justify-end gap-3">
            <button onclick="fecharTodosDrawers()" class="px-5 py-3 rounded-xl text-slate-500 font-bold hover:bg-slate-200 dark:hover:bg-slate-700 text-sm transition">Cancelar</button>
            <button onclick="salvarConta()" class="px-8 py-3 rounded-xl bg-primary text-white font-bold shadow-lg shadow-blue-500/20 text-sm flex items-center gap-2 active:scale-95 transition"><i data-lucide="check" class="w-4 h-4"></i> Salvar</button>
        </div>
    </div>

    <!-- DRAWER: EXTRATO RÁPIDO -->
    <div id="drawerExtrato" class="drawer-base fixed inset-y-0 right-0 w-full sm:w-[600px] z-50">
        <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">
            <div>
                <h2 class="text-lg font-bold text-slate-800 dark:text-white">Extrato Recente</h2>
                <p class="text-xs text-slate-400" id="extratoTitulo">...</p>
            </div>
            <button onclick="fecharTodosDrawers()" class="p-2 bg-slate-200 dark:bg-slate-700 rounded-full hover:opacity-80 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto custom-scrollbar p-0">
            <table class="w-full text-left">
                <thead class="bg-slate-50 dark:bg-slate-900/50 text-xs font-bold text-slate-500 uppercase sticky top-0">
                    <tr>
                        <th class="p-4">Data</th>
                        <th class="p-4">Descrição</th>
                        <th class="p-4 text-right">Valor</th>
                    </tr>
                </thead>
                <tbody id="listaExtrato" class="text-sm divide-y divide-slate-100 dark:divide-slate-700">
                    <tr><td colspan="3" class="p-6 text-center text-slate-400">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-center">
            <a href="lancamentos.html" class="text-sm font-bold text-primary hover:underline">Ver lançamentos completos</a>
        </div>
    </div>

    <!-- SCRIPT -->
    <script type="module">
        import { authGuard } from './js/auth.js';
        import { renderSidebar } from './js/components.js';
        import { apiFetch } from './js/api.js';
        import { initTheme } from './js/theme.js';

        authGuard(); initTheme(); renderSidebar('contas');

        window.abrirDrawer = abrirDrawer;
        window.fecharTodosDrawers = fecharTodosDrawers;
        window.salvarConta = salvarConta;
        window.editarConta = editarConta;
        window.verExtrato = verExtrato;
        window.excluirConta = excluirConta;
        window.carregarDados = carregarDados;

        const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
        let contasCache = [];
        let centrosCache = [];

        carregarDados();

        async function carregarDados() {
            try {
                const [contas, centros] = await Promise.all([
                    apiFetch('/contas/'),
                    apiFetch('/centro_custo/')
                ]);
                contasCache = contas || [];
                centrosCache = centros || [];
                
                renderizarGrid();
                popularSelectCentro();
            } catch(e) { console.error(e); }
        }

        function renderizarGrid() {
            const grid = document.getElementById('gridContas');
            grid.innerHTML = '';
            
            let saldoTotal = 0;

            if (contasCache.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl">Nenhuma conta cadastrada.</div>';
                document.getElementById('saldoGeral').innerText = BRL.format(0);
                return;
            }

            contasCache.forEach(c => {
                const saldoAtual = parseFloat(c.saldo_atual || 0); // Backend calcula isso agora
                const saldoInicial = parseFloat(c.saldo_inicial || 0);
                saldoTotal += saldoAtual;

                // Cor do saldo (Verde se >= Inicial, Vermelho se < Inicial, ou apenas positivo/negativo)
                const corSaldo = saldoAtual >= 0 ? 'text-slate-800 dark:text-white' : 'text-red-500';
                
                let icon = 'landmark';
                if(c.tipo === 'CAIXA') icon = 'banknote';
                if(c.tipo === 'INVESTIMENTO') icon = 'trending-up';

                const html = `
                <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 relative group conta-card">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500">
                                <i data-lucide="${icon}" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-700 dark:text-slate-200 leading-tight">${c.nome}</h3>
                                <p class="text-[10px] uppercase font-bold text-slate-400 mt-0.5">${c.banco || c.tipo}</p>
                            </div>
                        </div>
                        <div class="opacity-0 group-hover:opacity-100 transition flex gap-1">
                            <button onclick="editarConta(${c.id})" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-600 rounded text-blue-500"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                            <button onclick="excluirConta(${c.id})" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-600 rounded text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    
                    <div class="pt-2 border-t border-slate-100 dark:border-slate-700">
                        <div class="flex justify-between items-end">
                            <div>
                                <p class="text-[10px] uppercase font-bold text-slate-400 mb-0.5">Saldo Atual</p>
                                <p class="text-xl font-bold font-mono ${corSaldo}">${BRL.format(saldoAtual)}</p>
                            </div>
                            <button onclick="verExtrato(${c.id}, '${c.nome}')" class="text-xs font-bold text-primary hover:underline flex items-center gap-1">
                                Ver Extrato <i data-lucide="chevron-right" class="w-3 h-3"></i>
                            </button>
                        </div>
                        ${saldoInicial !== 0 ? `<p class="text-[10px] text-slate-400 mt-2">Inicial: ${BRL.format(saldoInicial)}</p>` : ''}
                    </div>
                </div>`;
                grid.innerHTML += html;
            });

            document.getElementById('saldoGeral').innerText = BRL.format(saldoTotal);
            lucide.createIcons();
        }

        async function verExtrato(id, nome) {
            document.getElementById('extratoTitulo').innerText = nome;
            document.getElementById('drawerOverlay').classList.add('overlay-open');
            document.getElementById('drawerExtrato').classList.add('drawer-open');
            
            const tbody = document.getElementById('listaExtrato');
            tbody.innerHTML = '<tr><td colspan="3" class="p-6 text-center text-slate-400">Carregando...</td></tr>';

            // Busca lançamentos apenas desta conta (precisa filtrar no front ou back, aqui filtro no front por simplicidade do endpoint genérico, mas ideal seria endpoint especifico)
            // Vou usar o endpoint de lancamentos e filtrar. Para produção com muitos dados, use paginação no backend filtrada.
            const lancamentos = await apiFetch('/lancamentos/');
            
            // Filtra: ID da conta E Status Pago (para ser extrato real)
            const extrato = lancamentos.filter(l => l.conta_id === id && l.status === 'PAGO')
                                       .sort((a,b) => new Date(b.data_pagamento) - new Date(a.data_pagamento))
                                       .slice(0, 15); // Pega só os ultimos 15

            if (extrato.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-6 text-center text-slate-400 italic">Nenhuma movimentação paga.</td></tr>';
                return;
            }

            tbody.innerHTML = extrato.map(l => `
                <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50">
                    <td class="p-4 font-mono text-xs text-slate-500">${new Date(l.data_pagamento).toLocaleDateString('pt-BR')}</td>
                    <td class="p-4 font-medium text-slate-700 dark:text-slate-200">${l.descricao}</td>
                    <td class="p-4 text-right font-bold ${l.tipo === 'RECEITA' ? 'text-emerald-600' : 'text-red-600'}">
                        ${l.tipo === 'DESPESA' ? '-' : ''}${BRL.format(l.valor_pago)}
                    </td>
                </tr>
            `).join('');
        }

        function abrirDrawer() {
            document.getElementById('contaId').value = '';
            document.getElementById('drawerTitulo').innerText = 'Nova Conta';
            document.getElementById('nome').value = '';
            document.getElementById('banco').value = '';
            document.getElementById('saldo_inicial').value = '';
            
            document.getElementById('drawerOverlay').classList.add('overlay-open');
            document.getElementById('drawerLateral').classList.add('drawer-open');
        }

        function editarConta(id) {
            const c = contasCache.find(x => x.id === id);
            if(!c) return;
            
            document.getElementById('contaId').value = c.id;
            document.getElementById('drawerTitulo').innerText = 'Editar Conta';
            document.getElementById('nome').value = c.nome;
            document.getElementById('banco').value = c.banco;
            document.getElementById('tipo').value = c.tipo;
            document.getElementById('saldo_inicial').value = c.saldo_inicial;
            document.getElementById('centro_custo_id').value = c.centro_custo_id || '';
            document.getElementById('status').value = c.status;

            document.getElementById('drawerOverlay').classList.add('overlay-open');
            document.getElementById('drawerLateral').classList.add('drawer-open');
        }

        async function salvarConta() {
            const id = document.getElementById('contaId').value;
            const payload = {
                nome: document.getElementById('nome').value,
                banco: document.getElementById('banco').value,
                tipo: document.getElementById('tipo').value,
                saldo_inicial: parseFloat(document.getElementById('saldo_inicial').value) || 0,
                centro_custo_id: parseInt(document.getElementById('centro_custo_id').value) || null,
                status: document.getElementById('status').value
            };

            if(!payload.nome) return Swal.fire('Erro', 'Nome é obrigatório', 'warning');

            let res;
            if(id) res = await apiFetch(`/contas/${id}`, { method: 'PATCH', body: JSON.stringify(payload) });
            else res = await apiFetch('/contas/', { method: 'POST', body: JSON.stringify(payload) });

            if(res) {
                fecharTodosDrawers();
                carregarDados();
                Swal.fire({ icon: 'success', title: 'Salvo!', timer: 1500, showConfirmButton: false });
            }
        }

        async function excluirConta(id) {
            if((await Swal.fire({ title: 'Excluir conta?', text: 'Cuidado!', icon: 'warning', showCancelButton: true })).isConfirmed) {
                await apiFetch(`/contas/${id}`, { method: 'DELETE' });
                carregarDados();
            }
        }

        function fecharTodosDrawers() {
            document.getElementById('drawerLateral').classList.remove('drawer-open');
            document.getElementById('drawerExtrato').classList.remove('drawer-open');
            document.getElementById('drawerOverlay').classList.remove('overlay-open');
        }

        function popularSelectCentro() {
            const sel = document.getElementById('centro_custo_id');
            sel.innerHTML = '<option value="">Sem vínculo</option>';
            centrosCache.forEach(cc => {
                sel.innerHTML += `<option value="${cc.id}">${cc.nome}</option>`;
            });
        }
    </script>
</body>
</html>

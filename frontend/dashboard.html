<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Kyrus ERP</title>
    
    <script src="js/init-theme.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { extend: { colors: { primary: 'var(--color-primary)' } } } 
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* Gradiente Principal (Indigo - Visão Geral) */
        .dashboard-gradient { background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); }
        
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        
        /* Input de Mês Customizado */
        input[type="month"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.5);
        }
        .dark input[type="month"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans h-screen flex overflow-hidden">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-full relative overflow-y-auto">
        
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-8 py-5 flex items-center justify-between sticky top-0 z-20 shadow-sm/50 backdrop-blur-sm bg-white/90 dark:bg-slate-800/90">
            <div>
                <h2 class="text-2xl font-bold tracking-tight">Visão Geral</h2>
                <p class="text-sm text-slate-400">Indicadores de performance</p>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="bg-slate-100 dark:bg-slate-700 rounded-lg p-1 flex items-center border border-slate-200 dark:border-slate-600 shadow-inner">
                    <button id="btnMesAnt" class="p-2 hover:bg-white dark:hover:bg-slate-600 rounded-md text-slate-500 transition shadow-sm"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <input type="month" id="filtroMes" class="bg-transparent border-0 text-sm font-bold text-slate-700 dark:text-white outline-none text-center w-36 cursor-pointer uppercase tracking-wider">
                    <button id="btnMesProx" class="p-2 hover:bg-white dark:hover:bg-slate-600 rounded-md text-slate-500 transition shadow-sm"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
                <button id="btnReload" class="p-2.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-slate-700 rounded-lg transition" title="Atualizar">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <div class="p-8 space-y-8 max-w-7xl mx-auto w-full">
            
            <div id="loadingSkeleton" class="animate-pulse space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="h-40 bg-slate-200 dark:bg-slate-700 rounded-2xl"></div>
                    <div class="h-40 bg-slate-200 dark:bg-slate-700 rounded-2xl"></div>
                    <div class="h-40 bg-slate-200 dark:bg-slate-700 rounded-2xl"></div>
                    <div class="h-40 bg-slate-200 dark:bg-slate-700 rounded-2xl"></div>
                </div>
                <div class="grid grid-cols-3 gap-6">
                    <div class="col-span-2 h-80 bg-slate-200 dark:bg-slate-700 rounded-2xl"></div>
                    <div class="h-80 bg-slate-200 dark:bg-slate-700 rounded-2xl"></div>
                </div>
            </div>

            <div id="dashboardContent" class="hidden space-y-8 animate-fade-in-up">
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    
                    <div class="dashboard-gradient p-6 rounded-2xl shadow-lg text-white relative overflow-hidden group">
                        <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl group-hover:scale-110 transition duration-700"></div>
                        
                        <div class="flex justify-between items-start relative z-10">
                            <div>
                                <p class="text-xs font-bold text-indigo-100 uppercase tracking-widest mb-1">Resultado Líquido</p>
                                <h3 class="text-3xl font-extrabold tracking-tight" id="kpiSaldo">R$ 0,00</h3>
                            </div>
                            <div class="p-2 bg-white/20 rounded-lg backdrop-blur-sm">
                                <i data-lucide="wallet" class="w-6 h-6 text-white"></i>
                            </div>
                        </div>

                        <div class="mt-6 relative z-10">
                            <div class="flex justify-between text-xs font-medium text-indigo-100 mb-1">
                                <span>Margem</span>
                                <span id="lblPorcentagem">0%</span>
                            </div>
                            <div class="w-full bg-black/20 rounded-full h-1.5 overflow-hidden">
                                <div id="barSaldo" class="bg-white h-1.5 rounded-full transition-all duration-1000" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 card-shadow hover:border-emerald-400 transition group">
                        <div class="flex justify-between items-start mb-4">
                            <div class="p-2 bg-emerald-50 dark:bg-emerald-900/20 rounded-lg text-emerald-600 dark:text-emerald-400 group-hover:bg-emerald-100 transition">
                                <i data-lucide="trending-up" class="w-5 h-5"></i>
                            </div>
                            <span class="text-xs font-bold text-slate-400 uppercase">Entradas</span>
                        </div>
                        <h3 class="text-2xl font-extrabold text-slate-800 dark:text-white mb-1" id="kpiReceitas">R$ 0,00</h3>
                        <div class="flex items-center gap-1 text-xs text-slate-500">
                            <span>A receber:</span>
                            <span id="kpiRecPend" class="font-bold text-emerald-600">R$ 0,00</span>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 card-shadow hover:border-red-400 transition group">
                        <div class="flex justify-between items-start mb-4">
                            <div class="p-2 bg-red-50 dark:bg-red-900/20 rounded-lg text-red-600 dark:text-red-400 group-hover:bg-red-100 transition">
                                <i data-lucide="trending-down" class="w-5 h-5"></i>
                            </div>
                            <span class="text-xs font-bold text-slate-400 uppercase">Saídas</span>
                        </div>
                        <h3 class="text-2xl font-extrabold text-slate-800 dark:text-white mb-1" id="kpiDespesas">R$ 0,00</h3>
                        <div class="flex items-center gap-1 text-xs text-slate-500">
                            <span>A pagar:</span>
                            <span id="kpiDespPend" class="font-bold text-red-600">R$ 0,00</span>
                        </div>
                    </div>

                    <div class="bg-slate-800 dark:bg-slate-700 p-6 rounded-2xl border border-slate-700 shadow-lg text-white relative overflow-hidden">
                        <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-emerald-500 rounded-full opacity-10 blur-2xl"></div>
                        <div class="flex justify-between items-start mb-4 relative z-10">
                            <div class="p-2 bg-slate-700 dark:bg-slate-600 rounded-lg text-slate-300">
                                <i data-lucide="landmark" class="w-5 h-5"></i>
                            </div>
                            <span class="text-xs font-bold text-slate-400 uppercase">Caixa Acumulado</span>
                        </div>
                        <h3 class="text-2xl font-extrabold text-white relative z-10" id="kpiCaixa">--</h3>
                        <p class="text-[10px] text-slate-400 mt-2 relative z-10">Balanço total de contas</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 card-shadow">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                <i data-lucide="bar-chart-2" class="w-4 h-4 text-indigo-500"></i>
                                Fluxo de Caixa Diário
                            </h3>
                        </div>
                        <div id="chartFluxo" class="w-full h-[320px]"></div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 card-shadow flex flex-col">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                <i data-lucide="pie-chart" class="w-4 h-4 text-purple-500"></i>
                                Onde gastei?
                            </h3>
                        </div>
                        <div class="flex-1 flex items-center justify-center relative">
                            <div id="chartCategorias" class="w-full h-[320px]"></div>
                            <div id="emptyStateCat" class="hidden absolute inset-0 flex flex-col items-center justify-center text-slate-400">
                                <i data-lucide="inbox" class="w-10 h-10 mb-2 opacity-50"></i>
                                <span class="text-xs font-bold uppercase">Sem despesas</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        import { authGuard } from './js/auth.js';
        import { renderSidebar } from './js/components.js';
        import { apiFetch } from './js/api.js';
        import { initTheme } from './js/theme.js';

        // 1. Inicialização
        authGuard();
        initTheme();
        renderSidebar('dashboard');
        
        // 2. Estado
        const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
        let chartFluxoInst = null;
        let chartCatInst = null;

        // 3. Setup Inicial
        const hoje = new Date();
        const anoMes = hoje.toISOString().slice(0, 7); 
        document.getElementById('filtroMes').value = anoMes;

        // 4. Listeners
        document.getElementById('filtroMes').addEventListener('change', carregarDashboard);
        document.getElementById('btnReload').addEventListener('click', () => {
            // Animaçãozinha de reload
            const icon = document.querySelector('#btnReload i');
            icon.classList.add('animate-spin');
            carregarDashboard().then(() => setTimeout(() => icon.classList.remove('animate-spin'), 500));
        });
        document.getElementById('btnMesAnt').addEventListener('click', () => mudarMes(-1));
        document.getElementById('btnMesProx').addEventListener('click', () => mudarMes(1));

        // 5. Executar
        carregarDashboard();

        // --- FUNÇÕES ---

        function mudarMes(delta) {
            const input = document.getElementById('filtroMes');
            if(!input.value) return;
            const parts = input.value.split('-');
            const data = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1 + delta, 1);
            const novoMes = String(data.getMonth() + 1).padStart(2, '0');
            input.value = `${data.getFullYear()}-${novoMes}`;
            carregarDashboard();
        }

        async function carregarDashboard() {
            // Mostra Skeleton, esconde conteúdo
            document.getElementById('loadingSkeleton').classList.remove('hidden');
            document.getElementById('dashboardContent').classList.add('hidden');

            const mes = document.getElementById('filtroMes').value;
            
            try {
                const dados = await apiFetch(`/dashboard/resumo?mes=${mes}`);
                
                if (dados) {
                    atualizarKPIs(dados.kpis);
                    renderizarGraficoFluxo(dados.grafico_fluxo);
                    renderizarGraficoCategorias(dados.grafico_categorias);
                    
                    // Busca saldo de contas (separado, opcional)
                    carregarSaldoContas(); 
                }
            } catch (error) {
                console.error("Erro dashboard:", error);
            } finally {
                // Esconde Skeleton, mostra conteúdo
                document.getElementById('loadingSkeleton').classList.add('hidden');
                document.getElementById('dashboardContent').classList.remove('hidden');
                lucide.createIcons();
            }
        }

        async function carregarSaldoContas() {
            try {
                const contas = await apiFetch('/contas/');
                if (contas) {
                    const total = contas.reduce((acc, c) => acc + (parseFloat(c.saldo_inicial) || 0), 0);
                    // Aqui seria ideal somar também os lançamentos realizados, 
                    // mas para este exemplo usaremos o saldo base + kpi do mes (simplificado)
                    // Num sistema real, o endpoint /dashboard deveria retornar esse saldo consolidado.
                    document.getElementById('kpiCaixa').innerText = BRL.format(total); 
                }
            } catch (e) { console.error(e); }
        }

        function atualizarKPIs(kpis) {
            const saldo = parseFloat(kpis.saldo);
            const receitas = parseFloat(kpis.total_receitas);
            const despesas = parseFloat(kpis.total_despesas);
            
            document.getElementById('kpiReceitas').innerText = BRL.format(receitas);
            document.getElementById('kpiDespesas').innerText = BRL.format(despesas);
            document.getElementById('kpiSaldo').innerText = BRL.format(saldo);
            
            // Pendentes
            document.getElementById('kpiRecPend').innerText = BRL.format(kpis.total_receitas_pendentes);
            document.getElementById('kpiDespPend').innerText = BRL.format(kpis.total_despesas_pendentes);

            // Barra Visual de Porcentagem
            const totalMov = receitas + despesas;
            let perc = 0;
            if (totalMov > 0) {
                perc = (receitas / totalMov) * 100;
            }
            // Se saldo positivo, barra cheia ou proporcional. Se negativo, visual muda.
            // Vamos simplificar: barra mostra % de receita sobre o volume total
            document.getElementById('barSaldo').style.width = `${Math.min(perc, 100)}%`;
            document.getElementById('lblPorcentagem').innerText = perc.toFixed(0) + '% Entradas';
        }

        function renderizarGraficoFluxo(dadosFluxo) {
            const isDark = document.documentElement.classList.contains('dark');
            
            const categories = dadosFluxo.map(d => d.data.split('-')[2]); // Dia
            const dataRec = dadosFluxo.map(d => d.receitas);
            const dataDesp = dadosFluxo.map(d => d.despesas);

            const options = {
                series: [
                    { name: 'Entradas', data: dataRec },
                    { name: 'Saídas', data: dataDesp }
                ],
                chart: { 
                    type: 'area', 
                    height: 320, 
                    toolbar: { show: false }, 
                    fontFamily: 'inherit', 
                    background: 'transparent',
                    animations: { enabled: true }
                },
                colors: ['#10b981', '#ef4444'],
                fill: {
                    type: 'gradient',
                    gradient: {
                        shadeIntensity: 1,
                        opacityFrom: 0.4,
                        opacityTo: 0.05,
                        stops: [0, 90, 100]
                    }
                },
                dataLabels: { enabled: false },
                stroke: { curve: 'smooth', width: 2 },
                xaxis: { 
                    categories: categories, 
                    labels: { style: { colors: isDark ? '#94a3b8' : '#64748b' } },
                    axisBorder: { show: false },
                    axisTicks: { show: false }
                },
                yaxis: { 
                    labels: { 
                        style: { colors: isDark ? '#94a3b8' : '#64748b' }, 
                        formatter: (val) => val >= 1000 ? `${(val/1000).toFixed(1)}k` : val 
                    } 
                },
                grid: { borderColor: isDark ? '#334155' : '#f1f5f9', strokeDashArray: 4 },
                theme: { mode: isDark ? 'dark' : 'light' },
                tooltip: { theme: isDark ? 'dark' : 'light' }
            };

            if (chartFluxoInst) chartFluxoInst.destroy();
            chartFluxoInst = new ApexCharts(document.querySelector("#chartFluxo"), options);
            chartFluxoInst.render();
        }

        function renderizarGraficoCategorias(dadosCat) {
            const isDark = document.documentElement.classList.contains('dark');
            const elChart = document.querySelector("#chartCategorias");
            const elEmpty = document.querySelector("#emptyStateCat");

            if(!dadosCat || dadosCat.length === 0) {
                elChart.classList.add('hidden');
                elEmpty.classList.remove('hidden');
                return;
            } else {
                elChart.classList.remove('hidden');
                elEmpty.classList.add('hidden');
            }

            const labels = dadosCat.map(d => d.categoria);
            const values = dadosCat.map(d => d.valor);

            const options = {
                series: [{ name: 'Valor', data: values }],
                chart: { 
                    type: 'bar', 
                    height: 320, 
                    toolbar: { show: false }, 
                    fontFamily: 'inherit', 
                    background: 'transparent' 
                },
                plotOptions: { 
                    bar: { 
                        borderRadius: 4, 
                        horizontal: true, 
                        barHeight: '50%',
                        distributed: true // Cores diferentes por barra fica bonito
                    } 
                },
                colors: ['#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#ec4899'], // Paleta Roxo/Rosa
                dataLabels: { 
                    enabled: true, 
                    textAnchor: 'start', 
                    style: { colors: ['#fff'] }, 
                    formatter: (val) => BRL.format(val),
                    offsetX: 0,
                },
                xaxis: { 
                    categories: labels, 
                    labels: { show: false },
                    axisBorder: { show: false },
                    axisTicks: { show: false }
                },
                yaxis: {
                    labels: { style: { colors: isDark ? '#e2e8f0' : '#475569', fontSize: '12px', fontWeight: 600 } }
                },
                grid: { show: false },
                theme: { mode: isDark ? 'dark' : 'light' },
                tooltip: { theme: isDark ? 'dark' : 'light' },
                legend: { show: false }
            };

            if (chartCatInst) chartCatInst.destroy();
            chartCatInst = new ApexCharts(elChart, options);
            chartCatInst.render();
        }
    </script>
</body>
</html>

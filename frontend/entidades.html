<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entidades - Kyrus ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: 'var(--color-primary)' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/init-theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans h-screen flex overflow-hidden">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-full relative">
        
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-8 py-5 flex items-center justify-between shadow-sm z-10">
            <div>
                <h2 class="text-2xl font-bold tracking-tight">Entidades</h2>
                <p class="text-sm text-slate-400">Clientes e Fornecedores</p>
            </div>
            <div class="flex gap-3">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Buscar..." 
                        class="pl-9 pr-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm w-64 bg-slate-50 dark:bg-slate-700 focus:ring-2 focus:ring-primary outline-none transition">
                </div>
                <button id="btnNovo" class="bg-primary hover:bg-blue-600 text-white px-5 py-2 rounded-lg shadow-md flex items-center gap-2 font-medium transition active:scale-95">
                    <i data-lucide="plus" class="w-4 h-4"></i> Nova
                </button>
            </div>
        </header>

        <div class="p-8 flex-1 overflow-y-auto">
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 dark:bg-slate-700/50 border-b border-slate-200 dark:border-slate-700">
                        <tr>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase">Nome / Razão Social</th>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase">Tipo</th>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase">Documento</th>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase">Status</th>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaEntidades" class="divide-y divide-slate-100 dark:divide-slate-700">
                        <!-- JS preenche aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL -->
    <div id="modalEntidade" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">
                <h3 class="font-bold text-lg" id="modalTitulo">Nova Entidade</h3>
                <button id="btnFecharModal" class="text-slate-400 hover:text-red-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="formEntidade" class="p-6 space-y-4">
                <input type="hidden" id="entidadeId">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nome *</label>
                    <input type="text" id="nome" class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tipo</label>
                        <select id="tipo" class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600">
                            <option value="CLIENTE">Cliente</option>
                            <option value="FORNECEDOR">Fornecedor</option>
                            <option value="AMBOS">Ambos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Status</label>
                        <select id="status" class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600">
                            <option value="ATIVO">Ativo</option>
                            <option value="INATIVO">Inativo</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">CPF / CNPJ</label>
                    <input type="text" id="cpf_cnpj" class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600">
                </div>
                <div class="pt-4 flex justify-end gap-2 border-t border-slate-100 dark:border-slate-700 mt-2">
                    <button type="button" id="btnCancelar" class="px-4 py-2 text-slate-500 font-bold hover:bg-slate-100 dark:hover:bg-slate-700 rounded">Cancelar</button>
                    <button type="submit" class="px-6 py-2 bg-primary text-white font-bold rounded shadow hover:brightness-90">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { authGuard } from './js/auth.js';
        import { renderSidebar } from './js/components.js';
        import { apiFetch } from './js/api.js';
        import { initTheme } from './js/theme.js';

        authGuard();
        initTheme();
        renderSidebar('entidades');

        let todasEntidades = [];

        // Inicialização
        carregarEntidades();

        // Event Listeners
        document.getElementById('searchInput').addEventListener('keyup', filtrarTabela);
        document.getElementById('btnNovo').addEventListener('click', () => abrirModal());
        document.getElementById('btnFecharModal').addEventListener('click', fecharModal);
        document.getElementById('btnCancelar').addEventListener('click', fecharModal);
        
        document.getElementById('formEntidade').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('entidadeId').value;
            const payload = {
                nome: document.getElementById('nome').value,
                tipo: document.getElementById('tipo').value,
                cpf_cnpj: document.getElementById('cpf_cnpj').value,
                status: document.getElementById('status').value
            };

            let res;
            if (id) {
                res = await apiFetch(`/entidades/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
            } else {
                res = await apiFetch('/entidades/', { method: 'POST', body: JSON.stringify(payload) });
            }

            if (res) {
                fecharModal();
                carregarEntidades();
                Swal.fire('Sucesso', 'Salvo com sucesso!', 'success');
            }
        });

        // Funções
        async function carregarEntidades() {
            const data = await apiFetch('/entidades/');
            if (data) {
                todasEntidades = data;
                renderizarTabela(data);
            }
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('listaEntidades');
            tbody.innerHTML = '';

            if (dados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">Nenhum registro encontrado.</td></tr>`;
                return;
            }

            dados.forEach(e => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 dark:hover:bg-slate-700/50 transition border-b border-slate-100 dark:border-slate-700";
                
                let badgeColor = e.tipo === 'CLIENTE' ? 'bg-green-100 text-green-700' : (e.tipo === 'FORNECEDOR' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700');
                
                tr.innerHTML = `
                    <td class="p-4 font-medium">${e.nome}</td>
                    <td class="p-4"><span class="${badgeColor} px-2 py-0.5 rounded text-[10px] font-bold border border-current opacity-80">${e.tipo}</span></td>
                    <td class="p-4 text-sm font-mono text-slate-500 dark:text-slate-400">${e.cpf_cnpj || '-'}</td>
                    <td class="p-4 text-xs font-bold ${e.status === 'ATIVO' ? 'text-green-600' : 'text-red-500'}">${e.status}</td>
                    <td class="p-4 text-right flex justify-end gap-2">
                        <button class="btn-editar p-2 text-blue-600 hover:bg-blue-50 rounded" data-id="${e.id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button class="btn-excluir p-2 text-red-600 hover:bg-red-50 rounded" data-id="${e.id}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Reatribui eventos aos botões dinâmicos
            document.querySelectorAll('.btn-editar').forEach(b => b.onclick = () => editar(b.dataset.id));
            document.querySelectorAll('.btn-excluir').forEach(b => b.onclick = () => excluir(b.dataset.id));
            lucide.createIcons();
        }

        function filtrarTabela() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = todasEntidades.filter(e => e.nome.toLowerCase().includes(termo) || (e.cpf_cnpj && e.cpf_cnpj.includes(termo)));
            renderizarTabela(filtrados);
        }

        function abrirModal() {
            document.getElementById('formEntidade').reset();
            document.getElementById('entidadeId').value = '';
            document.getElementById('modalTitulo').innerText = 'Nova Entidade';
            document.getElementById('modalEntidade').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalEntidade').classList.add('hidden');
        }

        function editar(id) {
            const item = todasEntidades.find(e => e.id == id);
            if (!item) return;
            document.getElementById('entidadeId').value = item.id;
            document.getElementById('nome').value = item.nome;
            document.getElementById('tipo').value = item.tipo;
            document.getElementById('cpf_cnpj').value = item.cpf_cnpj;
            document.getElementById('status').value = item.status;
            document.getElementById('modalTitulo').innerText = 'Editar Entidade';
            document.getElementById('modalEntidade').classList.remove('hidden');
        }

        async function excluir(id) {
            const result = await Swal.fire({
                title: 'Tem certeza?', text: "Não será possível reverter!", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Sim, excluir'
            });
            if (result.isConfirmed) {
                const res = await apiFetch(`/entidades/${id}`, { method: 'DELETE' });
                if (res) {
                    carregarEntidades();
                    Swal.fire('Excluído!', 'Registro removido.', 'success');
                }
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lançamentos - Kyrus ERP</title>
    <script src="js/init-theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: 'var(--color-primary)' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lancamentos.css">
    <style>
        .modal-label { display: block; font-size: 0.75rem; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        .modal-input { width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.9rem; font-weight: 500; color: #1e293b; background: #f8fafc; }
        .modal-input:focus { border-color: #6366f1; background: #fff; outline: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans h-screen flex overflow-hidden">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-full relative overflow-hidden ml-64 transition-all duration-300">
        
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 px-6 py-4 flex items-center justify-between z-20">
            <div class="flex items-center gap-4">
                <h2 class="text-xl font-bold tracking-tight">Lançamentos</h2>
                <div class="h-6 w-px bg-slate-200 mx-2"></div>
                <button onclick="abrirModalTransferencia()" class="flex items-center gap-2 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                    <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i> Entre Contas
                </button>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="search" onkeyup="aplicarFiltrosGerais()" placeholder="Buscar..." class="pl-9 pr-4 py-2 border rounded-lg text-sm w-64 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button onclick="toggleDrawer('drawerFiltros')" class="p-2 border rounded-lg hover:bg-slate-50 text-slate-500"><i data-lucide="filter" class="w-5 h-5"></i></button>
                <button onclick="abrirDrawerForm()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-md flex items-center gap-2 font-bold text-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> Novo
                </button>
            </div>
        </header>

        <div class="px-6 py-3 border-b border-slate-100 bg-white flex items-center gap-3 overflow-x-auto no-scrollbar">
            <button onclick="aplicarFiltroRapido('TODOS')" id="btn-todos" class="filter-btn active shadow-sm">Todos</button>
            <button onclick="aplicarFiltroRapido('ATRASADO')" id="btn-atrasado" class="filter-btn"><span class="w-2 h-2 rounded-full bg-red-500 mr-1"></span> Atrasados</button>
            <button onclick="aplicarFiltroRapido('HOJE')" id="btn-hoje" class="filter-btn"><span class="w-2 h-2 rounded-full bg-blue-500 mr-1"></span> Hoje</button>
            <button onclick="aplicarFiltroRapido('PAGO')" id="btn-pago" class="filter-btn"><i data-lucide="check" class="w-3 h-3 mr-1"></i> Pagos</button>
        </div>

        <div class="flex-1 overflow-y-auto p-6" id="containerLista">
            <div class="text-center text-slate-400 mt-10"><i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-2 mx-auto"></i> Carregando...</div>
        </div>
    </main>

    <div id="backdropForm" onclick="fecharDrawerForm()" class="fixed inset-0 bg-slate-900/50 z-40 hidden backdrop-blur-sm"></div>
    <div id="drawerFormulario" class="fixed inset-y-0 right-0 z-50 w-[600px] bg-white shadow-2xl transform translate-x-full drawer flex flex-col">
        <div class="px-6 py-5 border-b flex justify-between items-center">
            <h3 class="text-xl font-bold" id="drawerTitulo">Novo Lançamento</h3>
            <button onclick="fecharDrawerForm()"><i data-lucide="x" class="w-6 h-6 text-slate-400"></i></button>
        </div>
        <form id="formLancamento" class="flex-1 overflow-y-auto p-6 space-y-5">
            <input type="hidden" id="lancamentoId">
            <div class="flex gap-2 p-1 bg-slate-100 rounded-lg">
                <div id="btnTipoDespesa" onclick="setTipo('DESPESA')" class="flex-1 py-2 text-center text-xs font-bold rounded cursor-pointer transition">SAÍDA</div>
                <div id="btnTipoReceita" onclick="setTipo('RECEITA')" class="flex-1 py-2 text-center text-xs font-bold rounded cursor-pointer transition">ENTRADA</div>
                <input type="hidden" id="tipo" value="DESPESA">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="label-senior">Valor</label><input type="number" step="0.01" id="valor_previsto" class="input-senior font-bold" required></div>
                <div><label class="label-senior">Vencimento</label><input type="date" id="data_vencimento" class="input-senior" required></div>
            </div>
            <div><label class="label-senior">Categoria</label><select id="id_plano_contas" class="input-senior" onchange="aoMudarCategoria()"></select></div>
            <div><label class="label-senior">Entidade</label><select id="id_entidade" class="input-senior" onchange="autoPreencherCategoria()"></select></div>
            <div><label class="label-senior">Descrição</label><input type="text" id="descricao" class="input-senior"></div>
            <div class="border rounded-xl p-3">
                <div class="flex gap-4 mb-2 border-b pb-2">
                    <button type="button" onclick="switchTabPagamento('conta')" class="text-xs font-bold text-indigo-600">CONTA</button>
                    <button type="button" onclick="switchTabPagamento('cartao')" class="text-xs font-bold text-slate-400">CARTÃO</button>
                </div>
                <div id="content-conta" class="grid grid-cols-2 gap-2"></div>
                <div id="content-cartao" class="hidden grid grid-cols-2 gap-2"></div>
                <input type="hidden" id="id_conta_bancaria"><input type="hidden" id="id_cartao"><input type="hidden" id="cartao_fechamento"><input type="hidden" id="cartao_vencimento">
            </div>
            <div class="flex items-center gap-3 bg-slate-50 p-3 rounded border">
                <input type="checkbox" id="check_pago" class="w-5 h-5 accent-green-600" onclick="toggleCamposPagamento()">
                <label for="check_pago" class="font-bold text-sm">Pago / Baixado?</label>
            </div>
            <div id="area_pagamento" class="hidden grid grid-cols-2 gap-4">
                <div><label class="label-senior">Data Pagamento</label><input type="date" id="data_pagamento" class="input-senior"></div>
                <div><label class="label-senior">Valor Pago</label><input type="number" step="0.01" id="valor_pago" class="input-senior"></div>
                <div class="col-span-2"><input type="checkbox" id="conciliado"> <label>Conciliado</label></div>
            </div>
            <div class="bg-indigo-50 p-3 rounded border border-indigo-100">
                <div class="flex justify-between"><label class="font-bold text-xs text-indigo-800">Parcelamento</label><input type="checkbox" id="check_parcelado" onclick="toggleParcelamento()"></div>
                <div id="area_parcelas" class="hidden mt-2 grid grid-cols-2 gap-2">
                    <button type="button" onclick="setModoParcela('total')" id="btnParcelaTotal" class="p-1 text-[10px] font-bold rounded bg-white">Valor Total</button>
                    <button type="button" onclick="setModoParcela('fixo')" id="btnParcelaFixo" class="p-1 text-[10px] font-bold rounded bg-indigo-200">Valor Fixo</button>
                    <input type="number" id="qtd_parcelas" class="input-senior" value="2">
                    <input type="number" id="valor_parcela_input" class="input-senior bg-white" readonly>
                </div>
            </div>
            <input type="hidden" id="data_competencia"> </form>
        <div class="p-5 border-t flex justify-end gap-2">
            <button onclick="fecharDrawerForm()" class="px-4 py-2 font-bold text-slate-500">Cancelar</button>
            <button onclick="salvarLancamento()" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg">Salvar</button>
        </div>
    </div>

    <div id="modalTransferencia" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 border border-slate-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i data-lucide="arrow-left-right" class="text-indigo-600"></i> Transferência</h3>
                <button onclick="document.getElementById('modalTransferencia').classList.add('hidden')"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
            </div>
            
            <form id="formTransferencia" class="space-y-4">
                <div>
                    <label class="modal-label text-red-500">Sai da Conta</label>
                    <select id="transf_origem" class="modal-input cursor-pointer bg-red-50/50 focus:border-red-400"></select>
                </div>
                
                <div class="flex justify-center -my-2 relative z-10">
                    <div class="bg-slate-100 rounded-full p-1 border border-slate-200"><i data-lucide="arrow-down" class="w-4 h-4 text-slate-400"></i></div>
                </div>

                <div>
                    <label class="modal-label text-green-600">Entra na Conta</label>
                    <select id="transf_destino" class="modal-input cursor-pointer bg-green-50/50 focus:border-green-400"></select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="modal-label">Valor (R$)</label>
                        <input type="number" step="0.01" id="transf_valor" class="modal-input font-bold text-lg text-slate-700" placeholder="0,00" required>
                    </div>
                    <div>
                        <label class="modal-label">Data</label>
                        <input type="date" id="transf_data" class="modal-input text-sm" required>
                    </div>
                </div>

                <div>
                    <label class="modal-label">Descrição (Opcional)</label>
                    <input type="text" id="transf_obs" class="modal-input" placeholder="Ex: Sangria de caixa">
                </div>
                
                <div class="bg-indigo-50 p-3 rounded-lg flex items-start gap-3 border border-indigo-100 mt-2">
                    <div class="pt-0.5"><input type="checkbox" id="transf_efetivada" class="w-5 h-5 accent-indigo-600 cursor-pointer" checked></div>
                    <div>
                        <label for="transf_efetivada" class="block text-xs font-bold text-indigo-900 cursor-pointer select-none">Dinheiro caiu na hora?</label>
                        <p class="text-[10px] text-indigo-600">Se desmarcado, cria como "Pendente" (Agendado).</p>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-100">
                    <button type="button" onclick="document.getElementById('modalTransferencia').classList.add('hidden')" class="px-4 py-2 text-slate-500 font-bold text-sm hover:bg-slate-50 rounded-lg">Cancelar</button>
                    <button type="button" onclick="realizarTransferencia()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 shadow text-sm transition transform active:scale-95">Confirmar Transferência</button>
                </div>
            </form>
        </div>
    </div>

    <div id="backdropFiltros" class="hidden"></div> <script type="module" src="js/lancamentos.js"></script>
</body>
</html>

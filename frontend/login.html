<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Kyrus ERP</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)', // Integração com nossa variável
                    }
                }
            }
        }
    </script>
    <!-- Ícones e Estilos -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 h-screen flex items-center justify-center font-sans">

    <div class="w-full max-w-sm p-8 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-800 dark:text-white tracking-tight">
                Kyrus<span class="text-primary">ERP</span>
            </h1>
            <p class="text-slate-400 text-sm mt-2">Acesse sua conta para continuar</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">E-mail</label>
                <input type="email" id="email" required 
                    class="w-full p-3 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary outline-none transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Senha</label>
                <input type="password" id="password" required 
                    class="w-full p-3 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary outline-none transition">
            </div>
            
            <button type="submit" 
                class="w-full py-3 px-4 bg-primary hover:bg-primary-dark text-white font-bold rounded-xl shadow-lg transition transform active:scale-95 flex justify-center items-center gap-2">
                <span>Entrar</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
        <p id="errorMsg" class="mt-4 text-center text-sm text-red-500 font-bold hidden"></p>
    </div>

    <!-- Módulos JS (Type Module para usar import/export) -->
    <script type="module">
        import { initTheme } from './js/theme.js';
        import { login } from './js/auth.js';
        import { apiFetch } from './js/api.js';

        // Inicia o tema (Dark mode / Cor)
        initTheme();
        lucide.createIcons();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.submitter;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Carregando...'; btn.disabled = true;
            document.getElementById('errorMsg').classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Form Data para o OAuth2 padrão do FastAPI
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                // Fetch manual aqui pois apiFetch é para JSON, e login exige FormUrlEncoded
                const res = await fetch('http://localhost:8000/api/v1/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: formData
                });

                if (!res.ok) throw new Error();
                const data = await res.json();
                
                // Sucesso: Redireciona via Auth Controller
                login(data.access_token);

            } catch (err) {
                document.getElementById('errorMsg').innerText = "E-mail ou senha incorretos.";
                document.getElementById('errorMsg').classList.remove('hidden');
                btn.innerHTML = originalText; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
